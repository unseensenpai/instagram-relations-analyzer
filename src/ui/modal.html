<div id="ig-relations-modal-overlay" class="ig-relations-hidden">
  <div class="ig-relations-modal-window">
    <div class="ig-relations-modal-header">
      <h2 id="ig-relations-title" data-i18n="app.title">IG Relations Analyzer</h2>
      <button id="ig-relations-close-btn">&times;</button>
    </div>

    <div class="ig-relations-modal-body">
      <div class="ig-relations-sidebar">
        <button id="btn-fetch-data" class="btn-primary" data-i18n="sidebar.sync">Sync Target Profile</button>
        <div id="ig-cache-timestamp" class="ig-cache-info"></div>
        <hr />

        <div class="ig-filter-row">
          <button id="filter-following" class="btn-filter active">
            <span data-i18n="filter.following">Following</span> (<span id="cnt-following">0</span>)
          </button>
          <button class="btn-download-list" data-list="following" data-i18n-title="sidebar.downloadList">&darr;</button>
        </div>
        <div class="ig-filter-row">
          <button id="filter-followers" class="btn-filter">
            <span data-i18n="filter.followers">Followers</span> (<span id="cnt-followers">0</span>)
          </button>
          <button class="btn-download-list" data-list="followers" data-i18n-title="sidebar.downloadList">&darr;</button>
        </div>
        <div class="ig-filter-row">
          <button id="filter-not-following-back" class="btn-filter danger">
            <span data-i18n="filter.notFollowingBack">Not Following Back</span> (<span id="cnt-not-back">0</span>)
          </button>
          <button class="btn-download-list" data-list="notFollowingBack"
            data-i18n-title="sidebar.downloadList">&darr;</button>
        </div>
        <div class="ig-filter-row">
          <button id="filter-i-not-following-back" class="btn-filter">
            <span data-i18n="filter.iNotFollowingBack">You Don't Follow Back</span> (<span id="cnt-i-not-back">0</span>)
          </button>
          <button class="btn-download-list" data-list="iNotFollowingBack"
            data-i18n-title="sidebar.downloadList">&darr;</button>
        </div>

        <div class="ig-export-footer">
          <label class="ig-export-label" for="ig-relations-language" data-i18n="sidebar.language">Language</label>
          <div class="ig-select-wrapper">
            <select id="ig-relations-language"></select>
            <span class="ig-select-arrow">&#9660;</span>
          </div>

          <label class="ig-export-label" for="ig-relations-export-type" data-i18n="sidebar.format">Format</label>
          <div class="ig-select-wrapper">
            <select id="ig-relations-export-type">
              <option value="csv">Excel / CSV</option>
              <option value="json">JSON</option>
            </select>
            <span class="ig-select-arrow">&#9660;</span>
          </div>

          <button id="btn-export-data" class="btn-primary btn-export-all" data-i18n="sidebar.downloadAll">&darr;
            Download All</button>
        </div>
      </div>

      <div class="ig-relations-content">
        <div class="ig-search-bar">
          <input type="text" id="ig-relations-search" data-i18n-placeholder="search.placeholder" autocomplete="off" />
          <button id="ig-search-clear" data-i18n-title="search.clear">&times;</button>
        </div>

        <div id="ig-relations-spinner" class="ig-spinner"></div>
        <div id="ig-relations-status-message" data-i18n="status.welcome">Open any profile page and click "Sync Target
          Profile"...</div>

        <ul id="ig-relations-user-list"></ul>
      </div>
    </div>
  </div>
</div>
