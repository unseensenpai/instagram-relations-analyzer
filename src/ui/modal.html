<div id="ig-relations-modal-overlay" class="ig-relations-hidden">
  <div class="ig-relations-modal-window">
    <div class="ig-relations-modal-header">
      <h2 id="ig-relations-title" data-i18n="app.title">IG Relations Analyzer</h2>
      <button id="ig-relations-close-btn">&times;</button>
    </div>

    <div class="ig-relations-modal-body">
      <div class="ig-relations-sidebar">
        <button id="btn-fetch-data" class="btn-primary" data-i18n="sidebar.sync">Sync Target Profile</button>
        <button id="btn-compare-json" class="btn-secondary" data-i18n="compare.button">&#8644; Open / Compare (JSON/CSV)</button>
        <input type="file" id="ig-compare-file-input" accept=".json,.csv,application/json,text/csv" multiple class="ig-relations-hidden" />
        <div id="ig-cache-timestamp" class="ig-cache-info"></div>
        <hr />

        <div class="ig-sidebar-filters">
          <div class="ig-filter-row">
            <button id="filter-following" class="btn-filter active">
              <span data-i18n="filter.following">Following</span> (<span id="cnt-following">0</span>)
            </button>
            <button class="btn-download-list" data-list="following" data-i18n-title="sidebar.downloadList">&darr;</button>
          </div>
          <div class="ig-filter-row">
            <button id="filter-followers" class="btn-filter">
              <span data-i18n="filter.followers">Followers</span> (<span id="cnt-followers">0</span>)
            </button>
            <button class="btn-download-list" data-list="followers" data-i18n-title="sidebar.downloadList">&darr;</button>
          </div>
          <div class="ig-filter-row">
            <button id="filter-not-following-back" class="btn-filter danger">
              <span data-i18n="filter.notFollowingBack">Not Following Back</span> (<span id="cnt-not-back">0</span>)
            </button>
            <button class="btn-download-list" data-list="notFollowingBack"
              data-i18n-title="sidebar.downloadList">&darr;</button>
          </div>
          <div class="ig-filter-row">
            <button id="filter-i-not-following-back" class="btn-filter">
              <span data-i18n="filter.iNotFollowingBack">You Don't Follow Back</span> (<span id="cnt-i-not-back">0</span>)
            </button>
            <button class="btn-download-list" data-list="iNotFollowingBack"
              data-i18n-title="sidebar.downloadList">&darr;</button>
          </div>

          <div id="ig-compare-section" class="ig-compare-section ig-relations-hidden">
            <hr />
            <div class="ig-compare-section-header">
              <span class="ig-export-label" data-i18n="compare.sectionTitle">Comparison</span>
              <button id="btn-compare-clear-side" class="btn-compare-clear-link" data-i18n="compare.clear">Close</button>
            </div>

            <div class="ig-filter-row">
              <button id="filter-cmp-new-followers" class="btn-filter compare-positive">
                + <span data-i18n="compare.newFollowers">New Followers</span> (<span id="cnt-cmp-new-followers">0</span>)
              </button>
              <button class="btn-download-compare" data-compare-list="newFollowers"
                data-i18n-title="sidebar.downloadList">&darr;</button>
            </div>
            <div class="ig-filter-row">
              <button id="filter-cmp-lost-followers" class="btn-filter danger">
                &minus; <span data-i18n="compare.lostFollowers">Lost Followers</span> (<span id="cnt-cmp-lost-followers">0</span>)
              </button>
              <button class="btn-download-compare" data-compare-list="lostFollowers"
                data-i18n-title="sidebar.downloadList">&darr;</button>
            </div>
            <div class="ig-filter-row">
              <button id="filter-cmp-new-following" class="btn-filter compare-positive">
                + <span data-i18n="compare.newFollowing">New Following</span> (<span id="cnt-cmp-new-following">0</span>)
              </button>
              <button class="btn-download-compare" data-compare-list="newFollowing"
                data-i18n-title="sidebar.downloadList">&darr;</button>
            </div>
            <div class="ig-filter-row">
              <button id="filter-cmp-unfollowed" class="btn-filter compare-warning">
                &minus; <span data-i18n="compare.unfollowed">Unfollowed</span> (<span id="cnt-cmp-unfollowed">0</span>)
              </button>
              <button class="btn-download-compare" data-compare-list="unfollowed"
                data-i18n-title="sidebar.downloadList">&darr;</button>
            </div>
            <div class="ig-filter-row">
              <button id="filter-cmp-renamed" class="btn-filter compare-info">
                &#8635; <span data-i18n="compare.renamed">Username Changed</span> (<span id="cnt-cmp-renamed">0</span>)
              </button>
              <button class="btn-download-compare" data-compare-list="renamed"
                data-i18n-title="sidebar.downloadList">&darr;</button>
            </div>
          </div>
        </div>

        <div class="ig-export-footer">
          <label class="ig-export-label" for="ig-relations-language" data-i18n="sidebar.language">Language</label>
          <div class="ig-select-wrapper">
            <select id="ig-relations-language"></select>
            <span class="ig-select-arrow">&#9660;</span>
          </div>

          <label class="ig-export-label" for="ig-relations-export-type" data-i18n="sidebar.format">Format</label>
          <div class="ig-select-wrapper">
            <select id="ig-relations-export-type">
              <option value="csv">Excel / CSV</option>
              <option value="json">JSON</option>
            </select>
            <span class="ig-select-arrow">&#9660;</span>
          </div>

          <button id="btn-export-data" class="btn-primary btn-export-all" data-i18n="sidebar.downloadAll">&darr;
            Download All</button>
        </div>
      </div>

      <div class="ig-relations-content">
        <div id="ig-history-bar" class="ig-history-bar ig-relations-hidden">
          <span class="ig-history-label" data-i18n="history.label">History</span>
          <div class="ig-select-wrapper ig-history-select-wrap">
            <select id="ig-history-select"></select>
            <span class="ig-select-arrow">&#9660;</span>
          </div>
          <button id="btn-history-compare" class="btn-history-compare" data-i18n="history.compare">&#8644; Compare</button>
          <button id="btn-history-delete" class="btn-history-delete" data-i18n-title="history.deleteTitle">&times;</button>
        </div>

        <div id="ig-compare-banner" class="ig-compare-banner ig-relations-hidden">
          <div class="ig-compare-banner-top">
            <div id="ig-compare-snapshot-info" class="ig-compare-snapshot-info"></div>
            <div class="ig-compare-banner-actions">
              <button id="btn-compare-swap" class="btn-compare-action ig-relations-hidden" data-i18n="compare.swap">&#8646; Swap</button>
              <button id="btn-compare-change" class="btn-compare-action" data-i18n="compare.changeFile">Load Another File</button>
              <button id="btn-compare-export" class="btn-compare-action btn-compare-export" data-i18n="compare.export">&darr; Export Diff</button>
              <button id="btn-compare-close" class="btn-compare-action btn-compare-close" data-i18n="compare.clear">Close</button>
            </div>
          </div>
          <div id="ig-compare-deltas" class="ig-compare-deltas"></div>
          <div id="ig-compare-viz" class="ig-compare-viz"></div>
          <div id="ig-compare-warning" class="ig-compare-warning ig-relations-hidden"></div>
        </div>

        <div class="ig-search-bar">
          <input type="text" id="ig-relations-search" data-i18n-placeholder="search.placeholder" autocomplete="off" />
          <button id="ig-search-clear" data-i18n-title="search.clear">&times;</button>
        </div>

        <div id="ig-relations-spinner" class="ig-spinner"></div>
        <div id="ig-relations-status-message" data-i18n="status.welcome">Open any profile page and click "Sync Target
          Profile"...</div>

        <ul id="ig-relations-user-list"></ul>
      </div>
    </div>
  </div>
</div>
