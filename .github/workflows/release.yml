name: Create Production Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Package and Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The tag and manifest.json must agree, otherwise users install a build
      # whose reported version differs from the release they downloaded.
      - name: Verify manifest version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' manifest.json | head -1)
          echo "Tag:      $TAG_VERSION"
          echo "Manifest: $MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Zip Extension Files
        run: zip -r ig-relations-analyzer.zip src manifest.json README.md LICENCE

      # Use the matching release-notes file as the release body when present,
      # falling back to a generic message so a missing file never blocks a release.
      - name: Prepare release body
        run: |
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          {
            if [ -f "$NOTES_FILE" ]; then
              tail -n +2 "$NOTES_FILE"
            else
              echo "Automated release for ${GITHUB_REF_NAME}."
            fi
            echo ""
            echo "---"
            echo ""
            echo "### Installation"
            echo "1. Download \`ig-relations-analyzer.zip\` below."
            echo "2. Extract it anywhere on your computer."
            echo "3. Open \`chrome://extensions/\` in Chrome."
            echo "4. Enable **Developer mode** (top right)."
            echo "5. Click **Load unpacked** and select the extracted folder."
          } > RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ig-relations-analyzer.zip
          name: ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
